name: Deploy Agent-RS

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build without cache"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  push:
    branches: ["release/**", "main"]
    tags: ["**"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.agent-rs.yml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    uses: GlanceMind/platform-infra/.github/workflows/deploy-service.yml@main
    with:
      service_name: agent-rs
      image_name: gm_agent_rs
      dockerfile: Dockerfile
      compose_file: docker-compose.agent-rs.yml
      runner_labels: '["self-hosted", "backend", "p1"]'
      use_buildx: true
      no_cache: ${{ github.event.inputs.no_cache == 'true' }}
      container_name_filter: agent-rs
    secrets:
      ENV_FILE: |
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        TIKHUB_API_KEY=${{ secrets.TIKHUB_API_KEY }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        REDIS_URL=${{ vars.REDIS_URL || 'redis://host.docker.internal:6379/0' }}
        TIKHUB_BASE_URL=${{ vars.TIKHUB_BASE_URL || 'https://api.tikhub.io' }}
        FACEBOOK_RAPIDAPI_KEY=${{ secrets.FACEBOOK_RAPIDAPI_KEY }}
        FACEBOOK_RAPIDAPI_HOST=${{ vars.FACEBOOK_RAPIDAPI_HOST || 'facebook-scraper3.p.rapidapi.com' }}
        FACEBOOK_RAPIDAPI_BASE_URL=${{ vars.FACEBOOK_RAPIDAPI_BASE_URL || 'https://facebook-scraper3.p.rapidapi.com' }}
        OPENAI_BASE_URL=${{ vars.OPENAI_BASE_URL || 'https://api.laozhang.ai/v1' }}
        RUST_LOG=${{ vars.RUST_LOG || 'info,glance_mind_agent_rs=debug' }}
