# docker-compose.agent-rs.yml
# Production deployment configuration for glance_mind_agent_rs
#
# Usage:
#   docker-compose -f docker-compose.agent-rs.yml up -d --build
#
# Environment Variables (from .env file):
#   Required:
#     - DATABASE_URL: PostgreSQL connection string
#     - TIKHUB_API_KEY: TikHub API key
#     - AGENT_API_KEY: AI service API key
#   Optional (have defaults):
#     - REDIS_URL: Redis connection (default: redis://host.docker.internal:6379/0)
#     - TIKHUB_BASE_URL: TikHub API base URL
#     - AGENT_BASE_URL: AI service base URL
#     - RUST_LOG: Log level

services:
  agent-rs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Use host network to access Redis on 127.0.0.1 directly
    # Set REDIS_URL=redis://127.0.0.1:6379/0 in .env
    network_mode: host
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
