# docker-compose.agent-rs.yml
# Production deployment configuration for glance_mind_agent_rs
#
# Usage:
#   docker-compose -f docker-compose.agent-rs.yml up -d --build
#
# Environment Variables (from .env file):
#   Required:
#     - DATABASE_URL: PostgreSQL connection string
#     - TIKHUB_API_KEY: TikHub API key
#     - DEEPSEEK_API_KEY: AI service API key (DeepSeek OpenAI-compatible)
#   Optional for Facebook:
#     - FACEBOOK_RAPIDAPI_KEY: RapidAPI key for Facebook campaigns
#   Optional (have defaults):
#     - REDIS_URL: Redis connection (default: redis://host.docker.internal:6379/0)
#     - TIKHUB_BASE_URL: TikHub API base URL
#     - FACEBOOK_RAPIDAPI_HOST: RapidAPI host
#     - FACEBOOK_RAPIDAPI_BASE_URL: RapidAPI base URL
#     - DEEPSEEK_BASE_URL: AI service base URL (default: https://api.deepseek.com/v1)
#     - DEEPSEEK_MODEL: AI model name (default: deepseek-chat)
#     - RUST_LOG: Log level

services:
  agent-rs:
    image: gm_agent_rs:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-rs
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-crawler:task_queue}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY}
      TIKHUB_BASE_URL: ${TIKHUB_BASE_URL:-https://api.tikhub.io}
      FACEBOOK_RAPIDAPI_KEY: ${FACEBOOK_RAPIDAPI_KEY:-}
      FACEBOOK_RAPIDAPI_HOST: ${FACEBOOK_RAPIDAPI_HOST:-facebook-scraper3.p.rapidapi.com}
      FACEBOOK_RAPIDAPI_BASE_URL: ${FACEBOOK_RAPIDAPI_BASE_URL:-https://facebook-scraper3.p.rapidapi.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      RUST_LOG: ${RUST_LOG:-info,glance_mind_agent_rs=debug}
    # Same network configuration as scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "gm-agent", "--help"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
