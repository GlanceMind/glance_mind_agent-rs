# =============================================================================
# GlanceMind E2E Test Environment
# =============================================================================
# All environment variables are read from .env file
# Uses tmpfs for database to ensure fresh state on each run
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database (ephemeral - no persistent storage)
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: e2e-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e-network

  # ===========================================================================
  # Redis Task Queue (ephemeral)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: e2e-redis
    command: redis-server --appendonly no --save ""
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e-network

  # ===========================================================================
  # GlanceMind Scheduler
  # ===========================================================================
  scheduler:
    build:
      context: ../../glance_mind_worker/glance_mind_scheduler
      dockerfile: Dockerfile
    container_name: e2e-scheduler
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG}
      LAOZHANG_API_KEY: ${LAOZHANG_API_KEY}
      CHAT_API_KEY: ${CHAT_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - e2e-network
    restart: on-failure

  # ===========================================================================
  # GlanceMind Agent-rs
  # ===========================================================================
  agent-rs:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    container_name: e2e-agent-rs
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME}
      AGENT_WORKERS: ${AGENT_WORKERS}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY}
      TIKHUB_BASE_URL: ${TIKHUB_BASE_URL}
      # AI API (Python agent compatible: AGENT_*, also supports OPENAI_*)
      AGENT_API_KEY: ${AGENT_API_KEY}
      AGENT_BASE_URL: ${AGENT_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      RUST_LOG: ${RUST_LOG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - e2e-network
    restart: on-failure

  # ===========================================================================
  # Python Test Runner
  # ===========================================================================
  test-runner:
    image: python:3.11-slim
    container_name: e2e-test-runner
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      E2E_USER_ID: ${E2E_USER_ID}
      E2E_CAMPAIGN_ID: ${E2E_CAMPAIGN_ID}
      E2E_TIMEOUT: ${E2E_TIMEOUT}
      PYTHONUNBUFFERED: "1"
      TEST_FILE: ${TEST_FILE:-test_e2e_china_travel.py}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler:
        condition: service_started
      agent-rs:
        condition: service_started
    networks:
      - e2e-network
    command:
      - /bin/sh
      - -c
      - |
        echo "=== Installing dependencies ==="
        pip install --no-cache-dir psycopg2-binary redis pytest tenacity python-dotenv
        echo "=== Waiting for services to stabilize ==="
        sleep 5
        echo "=== Test runner ready (use docker compose exec to run tests) ==="
        tail -f /dev/null

networks:
  e2e-network:
    driver: bridge
