# =============================================================================
# GlanceMind Agent-RS E2E Test Environment (via gm-e2e infra)
# =============================================================================
# Uses shared infrastructure from gm-e2e instead of duplicating services.
#
# Usage:
#   docker compose up -d
#   docker compose exec test-runner pytest -v
#   docker compose down -v
#
# Alternative: cd ../../gm-e2e && make infra-worker-up
# =============================================================================

include:
  - path: ../../gm-e2e/infra/docker-compose.base.yml
  - path: ../../gm-e2e/infra/docker-compose.mocks.yml
  - path: ../../gm-e2e/infra/docker-compose.worker.yml

services:
  test-runner:
    image: python:3.11-slim
    container_name: agent-e2e-test-runner
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: glancemind
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: glancemind_e2e
      REDIS_HOST: redis
      REDIS_PORT: 6379
      E2E_USER_ID: ${E2E_USER_ID:-1}
      E2E_CAMPAIGN_ID: ${E2E_CAMPAIGN_ID:-1}
      E2E_TIMEOUT: ${E2E_TIMEOUT:-60}
      PYTHONUNBUFFERED: "1"
      TEST_FILE: ${TEST_FILE:-test_e2e_china_travel.py}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler:
        condition: service_started
      agent-rs:
        condition: service_started
    networks:
      - e2e-network
    command:
      - /bin/sh
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary redis pytest tenacity python-dotenv
        sleep 5
        echo "=== Test runner ready ==="
        tail -f /dev/null
